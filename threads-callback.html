<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Threads connected</title>
<style>
  body { margin: 0; background: #0f1218; color: #e8e4dc; font: 17px/1.6 -apple-system, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 20px; }
  button { font: inherit; padding: 12px 22px; border: 0; border-radius: 8px; background: #e8e4dc; color: #0f1218; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1 id="msg">Threads connected</h1>
  <p>Copy the one-time code and hand it to the uploader on your computer. The code is never shown on screen.</p>
  <!-- The code goes straight to the clipboard on a click, so nobody has to read or retype it. -->
  <p><button id="copy" type="button">코드 복사 / Copy code</button></p>
  <p id="done"></p>
</main>
<script>
  const code = (new URLSearchParams(location.search).get("code") || "").split("#")[0];
  if (!code) {
    document.getElementById("msg").textContent = "No code received";
    document.getElementById("copy").hidden = true;
  }
  // Some embedded browsers deny navigator.clipboard; the old execCommand path still works on a click.
  function legacyCopy(text) {
    const t = document.createElement("textarea");
    t.value = text;
    t.style.cssText = "position:fixed;left:-9999px;opacity:0";
    document.body.appendChild(t);
    t.select();
    const ok = document.execCommand("copy");
    t.remove();
    return ok;
  }
  document.getElementById("copy").onclick = async () => {
    const done = document.getElementById("done");
    let ok = legacyCopy(code);
    if (!ok) {
      try { await navigator.clipboard.writeText(code); ok = true; } catch (e) {}
    }
    done.textContent = ok ? "복사됨 / Copied" : "복사 실패 / Copy failed";
  };
</script>
</body>
</html>
